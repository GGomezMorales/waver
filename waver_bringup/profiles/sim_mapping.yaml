# Simulation + online mapping: Gazebo + EKF + SLAM Toolbox + RViz.
#
# SLAM Toolbox publishes map -> odom; the EKF publishes odom -> base_footprint.
# Save the resulting map with:
#   ros2 launch waver_mapping map_saver.launch.xml map_name:=<name>

arguments:
  use_sim_time: "true"

stages:
  simulation:
    enabled: true
    package: waver_gazebo
    launch_file: gazebo.launch.xml
    arguments:
      gui: "true"
      model: $(find-pkg-share waver_description)/urdf/waver.xacro
      world_file: $(find-pkg-share waver_gazebo)/worlds/room.sdf

  state_estimation:
    enabled: true
    package: waver_localization
    launch_file: ekf.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_localization)/param/ekf.yaml
      odom_topic: odom/raw
      imu_topic: imu/data
      output_topic: odom

  mapping:
    enabled: true
    package: waver_mapping
    launch_file: slam_toolbox.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_mapping)/param/slam_toolbox.yaml

  visualization:
    enabled: true
    package: waver_viz
    launch_file: rviz.launch.xml
    arguments:
      rviz_config: $(find-pkg-share waver_viz)/rviz/mapping.rviz
