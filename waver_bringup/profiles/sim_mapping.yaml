# Simulation + online mapping: Gazebo + SLAM Toolbox + RViz.
#
# SLAM Toolbox publishes map -> odom; Gazebo publishes odom -> base_footprint.
# Save the resulting map with:
#   ros2 launch waver_mapping map_saver.launch.xml map_name:=<name>

arguments:
  use_sim_time: "true"

stages:
  simulation:
    enabled: true
    package: waver_gazebo
    launch_file: gazebo.launch.xml
    arguments:
      gui: "true"
      model: $(find-pkg-share waver_description)/urdf/waver.xacro
      world_file: $(find-pkg-share waver_gazebo)/worlds/room.sdf

  mapping:
    enabled: true
    package: waver_mapping
    launch_file: slam_toolbox.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_mapping)/param/slam_toolbox.yaml

  visualization:
    enabled: true
    package: waver_viz
    launch_file: rviz.launch.xml
    arguments:
      rviz_config: $(find-pkg-share waver_viz)/rviz/mapping.rviz
