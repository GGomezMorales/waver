# Stage-swap example: identical to sim_mapping except the mapping stage runs
# the *upstream* slam_toolbox launch file instead of waver_mapping's wrapper.
# Only this profile changed — no bringup or capability code was edited.
#
# The same swap works for any backend: point 'package'/'launch_file' at the
# implementation you want and pass its arguments, e.g. a Cartographer wrapper
# package once one exists.

arguments:
  use_sim_time: "true"

stages:
  simulation:
    enabled: true
    package: waver_gazebo
    launch_file: gazebo.launch.xml
    arguments:
      world_file: $(find-pkg-share waver_gazebo)/worlds/room.sdf

  mapping:
    enabled: true
    package: slam_toolbox
    launch_file: online_async_launch.py
    arguments:
      slam_params_file: $(find-pkg-share waver_mapping)/param/slam_toolbox.yaml

  visualization:
    enabled: true
    package: waver_viz
    launch_file: rviz.launch.xml
