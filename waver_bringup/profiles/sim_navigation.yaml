# Simulation + saved-map navigation: Gazebo + EKF + map server + AMCL + Nav2 + RViz.
#
# Full autonomous stack. AMCL is the only publisher of map -> odom; the EKF
# publishes odom -> base_footprint. Send goals with RViz "2D Goal Pose".

arguments:
  use_sim_time: "true"

stages:
  simulation:
    enabled: true
    package: waver_gazebo
    launch_file: gazebo.launch.xml
    arguments:
      gui: "true"
      model: $(find-pkg-share waver_description)/urdf/waver.xacro
      world_file: $(find-pkg-share waver_gazebo)/worlds/room.sdf

  state_estimation:
    enabled: true
    package: waver_localization
    launch_file: ekf.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_localization)/param/ekf.yaml
      odom_topic: odom/raw
      imu_topic: imu/data
      output_topic: odom

  map_provider:
    enabled: true
    package: waver_localization
    launch_file: map_server.launch.xml
    arguments:
      map_file: $(find-pkg-share waver_localization)/maps/room.yaml

  localization:
    enabled: true
    package: waver_localization
    launch_file: amcl.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_localization)/param/amcl.yaml

  navigation:
    enabled: true
    package: waver_navigation
    launch_file: nav2.launch.py
    arguments:
      autostart: "true"

  visualization:
    enabled: true
    package: waver_viz
    launch_file: rviz.launch.xml
    arguments:
      rviz_config: $(find-pkg-share waver_viz)/rviz/navigation.rviz
