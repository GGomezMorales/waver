# Simulation + saved-map navigation: Gazebo + map server + AMCL + Nav2 + RViz.
#
# Full autonomous stack. AMCL is the only publisher of map -> odom; Gazebo
# publishes odom -> base_footprint. Send goals with RViz "2D Goal Pose".

arguments:
  use_sim_time: "true"

stages:
  simulation:
    enabled: true
    package: waver_gazebo
    launch_file: gazebo.launch.xml
    arguments:
      world_file: $(find-pkg-share waver_gazebo)/worlds/room.sdf

  map_provider:
    enabled: true
    package: waver_localization
    launch_file: map_server.launch.xml
    arguments:
      map: $(find-pkg-share waver_localization)/maps/room.yaml

  localization:
    enabled: true
    package: waver_localization
    launch_file: amcl.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_localization)/param/amcl.yaml

  navigation:
    enabled: true
    package: waver_navigation
    launch_file: nav2.launch.xml
    arguments:
      params_file: $(find-pkg-share waver_navigation)/param/nav2.yaml
      autostart: "true"

  visualization:
    enabled: true
    package: waver_viz
    launch_file: rviz.launch.xml
