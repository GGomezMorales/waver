velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 30.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [0.60, 0.0, 2.0]
    min_velocity: [0.0, 0.0, -2.0]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.8, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
