local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.2
      rolling_window: true

      width: 3
      height: 3
      resolution: 0.025
      footprint: "[[-0.092, -0.087], [-0.092, 0.087], [0.092, 0.087], [0.092, -0.087]]"
      footprint_padding: 0.01

      plugins: ["obstacle_layer", "denoise_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.5
          raytrace_min_range: 0.20
          obstacle_max_range: 3.0
          obstacle_min_range: 0.20

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30
        cost_scaling_factor: 6.0
        inflate_unknown: false
        inflate_around_unknown: false

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.2

      resolution: 0.05
      footprint: "[[-0.092, -0.087], [-0.092, 0.087], [0.092, 0.087], [0.092, -0.087]]"
      footprint_padding: 0.01
      track_unknown_space: true

      plugins:
        ["static_layer", "obstacle_layer", "denoise_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          sensor_frame: lidar_link
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.5
          raytrace_min_range: 0.20
          obstacle_max_range: 5.0
          obstacle_min_range: 0.20

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.35
        cost_scaling_factor: 4.5
        inflate_unknown: false
        inflate_around_unknown: false

      always_send_full_costmap: true
