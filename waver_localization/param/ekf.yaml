# Local, continuous state estimate for a planar differential-drive robot.
#
# State-vector order for each *_config array:
#   x, y, z, roll, pitch, yaw,
#   vx, vy, vz, vroll, vpitch, vyaw,
#   ax, ay, az
#
# Wheel odometry supplies forward velocity, the nonholonomic vy=0 constraint,
# and encoder-derived yaw rate. The IMU supplies relative yaw and an
# independent yaw-rate observation. Wheel-integrated x/y/yaw are deliberately
# excluded to avoid feeding duplicate encoder information into the filter.
# Input drivers must publish meaningful, non-zero covariances.

waver_ekf:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0
    predict_to_current_time: true
    reset_on_time_jump: true

    print_diagnostics: true
    debug: false
    publish_tf: true
    publish_acceleration: false
    permit_corrected_publication: false

    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "base_footprint"
    world_frame: "odom"

    odom0: "odom/raw"
    odom0_config:
      [false, false, false,
        false, false, false,
        true,  true,  false,
        false, false, true,
        false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    imu0: "imu/data"
    imu0_config:
      [false, false, false,
        false, false, true,
        false, false, false,
        false, false, true,
        false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false

    use_control: false
    dynamic_process_noise_covariance: false
